name: Bug report
description: Something in Shepi doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Everything here is public. Don't paste terminal output, paths or machine names. For a private report, use Help › Send Feedback in Shepi."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what Shepi did instead.
    validations:
      required: true
  - type: input
    id: shepi
    attributes:
      label: Shepi version
      description: Shepi › About Shepi.
      placeholder: "1.0.0"
  - type: input
    id: herdr
    attributes:
      label: Herdr version
      placeholder: "0.9.3"
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.1"
